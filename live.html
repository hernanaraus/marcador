<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Marcador En Vivo — Tiempo Fuera</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background: transparent !important;
            overflow: hidden;
        }
        .obs-anchor {
            position: absolute;
            bottom: 54px;
            left: 50%;
            transform: translateX(-50%) translateY(0) scale(var(--sb-scale, 1));
            transform-origin: bottom center;
            opacity: 1;
            transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1), transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: opacity, transform;
        }
        .obs-anchor.sb-hidden {
            opacity: 0;
            transform: translateX(-50%) translateY(42px) scale(calc(var(--sb-scale, 1) * 0.97));
            pointer-events: none;
        }
        .social-pill-wrap {
            position: absolute;
            right: calc(100% + 18px);
            top: 50%;
            transform: translateY(-50%) translateX(24px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1), transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 1;
        }
        .social-pill-wrap.active {
            opacity: 1;
            transform: translateY(-50%) translateX(0);
        }
        .social-pill {
            display: flex;
            align-items: center;
            gap: 11px;
            background: linear-gradient(145deg, #1b1d24 0%, #0d0e12 100%);
            border: 1.5px solid var(--sb-accent, #e3b857);
            border-radius: 10px;
            padding: 8px 16px 8px 12px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.18);
            white-space: nowrap;
            font-family: 'Barlow Condensed', sans-serif;
        }
        .social-icon {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 3px 10px rgba(0,0,0,0.6);
        }
        .social-icon.ig {
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
        }
        .social-icon.yt {
            background: linear-gradient(135deg, #ff1e1e 0%, #b80000 100%);
        }
        .social-texts {
            display: flex;
            flex-direction: column;
            line-height: 1.05;
        }
        .social-cta {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--sb-accent, #e3b857);
        }
        .social-handle {
            font-size: 21px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.4px;
        }
    </style>
</head>
<body>
    <div class="obs-anchor" id="obsAnchor">
        <div class="social-pill-wrap" id="socialWrap">
            <div class="social-pill" id="socialCard"></div>
        </div>
        <div id="marcadorMount"></div>
    </div>

    <script>
        const CANAL_BASE = 'tiempofuera/marcador/tf_canal_secreto_9981';
        const BROKER_URL = 'wss://broker.emqx.io:8084/mqtt';

        let configActual = {
            visible: true,
            boardScale: 1.0,
            fontFamily: "'Barlow Condensed', sans-serif",
            accentColor: "#e3b857",
            foulActiveColor: "#ffe600",
            foulBonusColor: "#ff1744",
            ligaSize: 92,
            teamLogoSize: 44,
            teamFontSize: 25,
            scoreBoxSize: 48,
            clockFontSize: 32,
            topBadgeEnabled: false,
            topBadgeMode: 'image',
            topImgSize: 44,
            topImgOffset: 18,
            topTextValue: '',
            topTextColor: '#ffffff',
            topTextSize: 15,
            topTextOffset: 14,
            showShotClock: true,
            name1: "LOCAL",
            bg1Color: "#1c1e24",
            text1Color: "#ffffff",
            name2: "VISITA",
            bg2Color: "#1c1e24",
            text2Color: "#ffffff",
            scoreBgColor: "#0c0d10",
            scoreTextColor: "#e3b857",
            shotBgColor: "#141519",
            shotTextColor: "#ff2a2a",
            clockBgColor: "#141519",
            clockTextColor: "#ffffff",
            periodTextColor: "#e3b857",
            logoLiga: '',
            logo1: '',
            logo2: '',
            logoTop: ''
        };

        let datosVivos = {};

        function aclararHex(hex, porcentaje) {
            hex = (hex || '#1c1e24').replace('#', '');
            let r = parseInt(hex.substring(0, 2), 16);
            let g = parseInt(hex.substring(2, 4), 16);
            let b = parseInt(hex.substring(4, 6), 16);
            r = Math.min(255, Math.floor(r + (255 - r) * porcentaje));
            g = Math.min(255, Math.floor(g + (255 - g) * porcentaje));
            b = Math.min(255, Math.floor(b + (255 - b) * porcentaje));
            return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
        }

        function oscurecerHex(hex, porcentaje) {
            hex = (hex || '#1c1e24').replace('#', '');
            let r = parseInt(hex.substring(0, 2), 16);
            let g = parseInt(hex.substring(2, 4), 16);
            let b = parseInt(hex.substring(4, 6), 16);
            r = Math.max(0, Math.floor(r * (1 - porcentaje)));
            g = Math.max(0, Math.floor(g * (1 - porcentaje)));
            b = Math.max(0, Math.floor(b * (1 - porcentaje)));
            return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
        }

        function calcularAnchoAla(cfg) {
            const maxChars = Math.max((cfg.name1 || '').length, (cfg.name2 || '').length);
            const fSize = cfg.teamFontSize || 25;
            const lSize = cfg.teamLogoSize || 44;
            const anchoTexto = Math.max(140, maxChars * (fSize * 0.56) + 26);
            return Math.round(anchoTexto + lSize + 28);
        }

        function aplicarVisibilidadYEscala(cfg) {
            const anchor = document.getElementById('obsAnchor');
            if (!anchor) return;
            const escala = parseFloat(cfg.boardScale) || 1.0;
            anchor.style.setProperty('--sb-scale', escala);
            anchor.style.setProperty('--sb-accent', cfg.accentColor || '#e3b857');

            if (cfg.visible === false) {
                anchor.classList.add('sb-hidden');
            } else {
                anchor.classList.remove('sb-hidden');
            }
        }

        function renderizarEstructura(cfg) {
            aplicarVisibilidadYEscala(cfg);

            const bg1Light = aclararHex(cfg.bg1Color, 0.24);
            const bg1Dark = oscurecerHex(cfg.bg1Color, 0.25);
            const bg2Light = aclararHex(cfg.bg2Color, 0.24);
            const bg2Dark = oscurecerHex(cfg.bg2Color, 0.25);

            const wingWidth = calcularAnchoAla(cfg);
            const ligaBoxHeight = Math.max(92, cfg.ligaSize || 92);
            const teamLogoSize = cfg.teamLogoSize || 44;
            const teamFontSize = cfg.teamFontSize || 25;

            const ptsFontSize = cfg.scoreBoxSize || 48;
            const scoreBoxHeight = Math.round(ptsFontSize * 1.42);
            const ptsMinWidth = Math.round(ptsFontSize * 1.18);
            const dashSize = Math.round(ptsFontSize * 0.62);
            const clockFontSize = cfg.clockFontSize || 32;
            const periodFontSize = Math.round(clockFontSize * 0.74);

            const ligaHTML = cfg.logoLiga ? `<img src="${cfg.logoLiga}" alt="Liga">` : '';

            let topBadgeHTML = '';
            if (cfg.topBadgeEnabled) {
                if (cfg.topBadgeMode === 'image' && cfg.logoTop) {
                    topBadgeHTML = `<div class="lm-top-overlay-img" style="top: -${cfg.topImgOffset}px;"><img src="${cfg.logoTop}" style="height:${cfg.topImgSize}px;" alt=""></div>`;
                } else if (cfg.topBadgeMode === 'text' && (cfg.topTextValue || '').trim() !== '') {
                    topBadgeHTML = `<div class="lm-top-overlay-text" style="top: -${cfg.topTextOffset}px; font-size: ${cfg.topTextSize}px; color: ${cfg.topTextColor};">${cfg.topTextValue}</div>`;
                }
            }

            const shotClockHTML = cfg.showShotClock ? `<div class="lm-shotclock-badge" id="shotclock"></div>` : '';
            let faltasBase = '';
            for (let i = 1; i <= 5; i++) {
                faltasBase += `<span class="foul-bar" data-idx="${i}"></span>`;
            }

            const img1HTML = cfg.logo1 ? `<img class="lm-team-logo" src="${cfg.logo1}" alt="">` : '';
            const img2HTML = cfg.logo2 ? `<img class="lm-team-logo" src="${cfg.logo2}" alt="">` : '';

            document.getElementById('marcadorMount').innerHTML = `
                <style>
                    .lm-bar { display: inline-flex; align-items: center; height: ${ligaBoxHeight}px; font-family: ${cfg.fontFamily}; user-select: none; filter: drop-shadow(0 16px 32px rgba(0, 0, 0, 0.88)) drop-shadow(0 4px 10px rgba(0, 0, 0, 0.7)); }
                    .lm-league-box { height: ${ligaBoxHeight}px; min-width: 86px; padding: 0 10px; display: flex; align-items: center; justify-content: center; margin-right: 10px; }
                    .lm-league-box img { height: ${cfg.ligaSize}px; width: auto; max-width: ${Math.round(cfg.ligaSize * 1.35)}px; object-fit: contain; filter: drop-shadow(0 5px 12px rgba(0,0,0,0.9)); }
                    .lm-track { display: inline-flex; align-items: center; position: relative; }
                    .lm-team-wing { position: relative; display: flex; align-items: center; height: 60px; width: ${wingWidth}px; padding: 0 14px 0 10px; gap: 10px; border-top: 1.5px solid ${cfg.accentColor}; border-bottom: 2px solid ${cfg.accentColor}; border-left: 1.5px solid ${cfg.accentColor}; border-radius: 10px 0 0 10px; box-sizing: border-box; box-shadow: inset 0 1px 0 rgba(255,255,255,0.24), inset 0 -4px 10px rgba(0,0,0,0.55); overflow: hidden; }
                    .lm-team-wing::before { content: ''; position: absolute; inset: 0; background-image: repeating-linear-gradient(-45deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 2px, transparent 2px, transparent 6px); pointer-events: none; }
                    .lm-team-wing.away { flex-direction: row-reverse; padding: 0 10px 0 14px; border-left: none; border-radius: 0; }
                    .lm-team-logo { position: relative; z-index: 2; height: ${teamLogoSize}px; width: ${teamLogoSize}px; object-fit: contain; flex-shrink: 0; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.8)); }
                    .lm-team-meta { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; min-width: 0; }
                    .lm-team-name { width: 100%; text-align: center; font-size: ${teamFontSize}px; font-weight: 800; letter-spacing: 0.7px; text-transform: uppercase; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 3px rgba(0,0,0,0.85), 0 -1px 0 rgba(255,255,255,0.2); }
                    .lm-fouls { display: flex; align-items: center; justify-content: center; gap: 5px; margin-top: 6px; width: 100%; }
                    .lm-team-wing.away .lm-fouls { flex-direction: row-reverse; justify-content: center; }
                    .foul-bar { width: 19px; height: 5px; border-radius: 2px; display: inline-block; flex-shrink: 0; transition: all 0.2s ease; }
                    .lm-scores-elevated { position: relative; display: flex; align-items: center; justify-content: center; height: ${scoreBoxHeight}px; background: linear-gradient(180deg, ${aclararHex(cfg.scoreBgColor, 0.14)} 0%, ${cfg.scoreBgColor} 50%, ${oscurecerHex(cfg.scoreBgColor, 0.35)} 100%); padding: 0 14px; gap: 6px; border: 2px solid ${cfg.accentColor}; border-radius: 9px; box-shadow: 0 10px 24px rgba(0,0,0,0.92), inset 0 1px 0 rgba(255,255,255,0.28), inset 0 -4px 10px rgba(0,0,0,0.7); z-index: 3; }
                    .lm-top-overlay-img { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 5; }
                    .lm-top-overlay-img img { width: auto; max-width: 210px; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.95)); }
                    .lm-top-overlay-text { position: absolute; left: 50%; transform: translateX(-50%); background: linear-gradient(180deg, ${aclararHex(cfg.scoreBgColor, 0.15)}, ${cfg.scoreBgColor}); border: 1.5px solid ${cfg.accentColor}; border-radius: 6px; padding: 2px 12px; font-weight: 800; letter-spacing: 0.9px; text-transform: uppercase; line-height: 1.1; white-space: nowrap; box-shadow: 0 5px 12px rgba(0,0,0,0.92), inset 0 1px 0 rgba(255,255,255,0.25); z-index: 5; }
                    .lm-pts { font-size: ${ptsFontSize}px; font-weight: 800; color: ${cfg.scoreTextColor}; min-width: ${ptsMinWidth}px; text-align: center; font-variant-numeric: tabular-nums; line-height: 0.92; letter-spacing: -0.5px; text-shadow: 0 3px 8px rgba(0,0,0,0.9); }
                    .lm-score-dash { font-size: ${dashSize}px; font-weight: 800; color: ${cfg.accentColor}; line-height: 1; opacity: 0.85; padding: 0 1px; }
                    .lm-shotclock-badge { position: absolute; bottom: -17px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, ${aclararHex(cfg.shotBgColor, 0.15)}, ${cfg.shotBgColor}); color: ${cfg.shotTextColor}; border: 1.5px solid ${cfg.accentColor}; border-radius: 6px; font-size: 19px; font-weight: 800; min-width: 40px; height: 24px; padding: 0 7px; font-variant-numeric: tabular-nums; line-height: 1; box-shadow: 0 6px 14px rgba(0,0,0,0.95), inset 0 1px 0 rgba(255,255,255,0.22); z-index: 4; }
                    .lm-shotclock-badge:empty { display: none; }
                    .lm-clock-box { display: flex; align-items: center; height: 60px; background: linear-gradient(180deg, ${aclararHex(cfg.clockBgColor, 0.15)} 0%, ${cfg.clockBgColor} 55%, ${oscurecerHex(cfg.clockBgColor, 0.3)} 100%); padding: 0 14px; gap: 10px; border: 1.5px solid ${cfg.accentColor}; border-radius: 0 10px 10px 0; box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), inset 0 -4px 10px rgba(0,0,0,0.55); }
                    .lm-timer { font-size: ${clockFontSize}px; font-weight: 700; color: ${cfg.clockTextColor}; font-variant-numeric: tabular-nums; letter-spacing: 0.5px; min-width: ${Math.round(clockFontSize * 2.25)}px; text-align: center; line-height: 1; text-shadow: 0 2px 5px rgba(0,0,0,0.85); }
                    .lm-period { font-size: ${periodFontSize}px; font-weight: 800; color: ${cfg.periodTextColor}; background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(0,0,0,0.25)); padding: 5px 9px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.18); box-shadow: inset 0 1px 0 rgba(255,255,255,0.15); line-height: 1; }
                </style>
                <div class="lm-bar">
                    <div class="lm-league-box">${ligaHTML}</div>
                    <div class="lm-track">
                        <div class="lm-team-wing" style="background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, transparent 45%, rgba(0,0,0,0.35) 100%), linear-gradient(90deg, ${bg1Dark} 0%, ${cfg.bg1Color} 45%, ${bg1Light} 100%);">
                            ${img1HTML}
                            <div class="lm-team-meta">
                                <div class="lm-team-name" style="color: ${cfg.text1Color};">${cfg.name1}</div>
                                <div class="lm-fouls" id="fouls1">${faltasBase}</div>
                            </div>
                        </div>
                        <div class="lm-scores-elevated">
                            ${topBadgeHTML}
                            <div class="lm-pts" id="points1">0</div>
                            <div class="lm-score-dash">-</div>
                            <div class="lm-pts" id="points2">0</div>
                            ${shotClockHTML}
                        </div>
                        <div class="lm-team-wing away" style="background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, transparent 45%, rgba(0,0,0,0.35) 100%), linear-gradient(270deg, ${bg2Dark} 0%, ${cfg.bg2Color} 45%, ${bg2Light} 100%);">
                            ${img2HTML}
                            <div class="lm-team-meta">
                                <div class="lm-team-name" style="color: ${cfg.text2Color};">${cfg.name2}</div>
                                <div class="lm-fouls" id="fouls2">${faltasBase}</div>
                            </div>
                        </div>
                        <div class="lm-clock-box">
                            <div class="lm-timer" id="timer">10:00</div>
                            <div class="lm-period" id="period">Q1</div>
                        </div>
                    </div>
                </div>
            `;
            aplicarDatosVivos();
        }

        function actualizarFaltas(id, cantidad) {
            const cont = document.getElementById(id);
            if (!cont) return;
            const barras = cont.querySelectorAll('.foul-bar');
            const num = parseInt(cantidad, 10) || 0;
            barras.forEach((b, idx) => {
                const n = idx + 1;
                const esBonus = n === 5;
                if (n <= num) {
                    const col = esBonus ? configActual.foulBonusColor : configActual.foulActiveColor;
                    b.style.background = col;
                    b.style.border = "1px solid #111111";
                    b.style.boxShadow = `0 0 6px rgba(0,0,0,0.9), 0 0 7px ${col}`;
                } else {
                    b.style.background = "rgba(0,0,0,0.52)";
                    b.style.border = "1px solid rgba(255,255,255,0.38)";
                    b.style.boxShadow = "none";
                }
            });
        }

        function formatearPeriodo(momentRaw, overtimeLed) {
            if (overtimeLed !== undefined && overtimeLed !== "" && overtimeLed !== "0") return "OT";
            const n = parseInt(String(momentRaw).replace(/[^0-9]/g, ""), 10);
            if (isNaN(n) || n <= 0) return "Q1";
            if (n <= 4) return "Q" + n;
            return "OT" + (n - 4);
        }

        function aplicarDatosVivos() {
            const l = datosVivos;
            if (!l) return;
            const p1 = (l.points_1 || l.points1 || l.score_1 || l.score1 || "").replace(/[^0-9]/g, "");
            const p2 = (l.points_2 || l.points2 || l.score_2 || l.score2 || "").replace(/[^0-9]/g, "");
            if (p1 !== "") document.getElementById("points1").textContent = p1;
            if (p2 !== "") document.getElementById("points2").textContent = p2;
            if (configActual.showShotClock && l.shotclock !== undefined) {
                const sc = document.getElementById("shotclock");
                if (sc) sc.textContent = l.shotclock.replace(/[^0-9]/g, "");
            }
            if (l.fouls_1 !== undefined) actualizarFaltas("fouls1", l.fouls_1.replace(/[^0-9]/g, ""));
            if (l.fouls_2 !== undefined) actualizarFaltas("fouls2", l.fouls_2.replace(/[^0-9]/g, ""));
            if (l.moment !== undefined && l.moment !== "") {
                document.getElementById("period").textContent = formatearPeriodo(l.moment, l.overtime_led);
            }
            if (l.timer !== undefined && l.timer !== "") {
                document.getElementById("timer").textContent = l.timer;
            }
        }

        let turnoRedSocial = 0;
        function mostrarBannerSocial() {
            if (configActual.visible === false) return;
            const wrap = document.getElementById('socialWrap');
            const card = document.getElementById('socialCard');
            if (!wrap || !card) return;

            if (turnoRedSocial === 0) {
                card.innerHTML = `
                    <div class="social-icon ig">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                        </svg>
                    </div>
                    <div class="social-texts">
                        <span class="social-cta">Síguenos en Instagram</span>
                        <span class="social-handle">@tiempofuera_cl</span>
                    </div>
                `;
            } else {
                card.innerHTML = `
                    <div class="social-icon yt">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffffff">
                            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                        </svg>
                    </div>
                    <div class="social-texts">
                        <span class="social-cta">¡Suscríbete!</span>
                        <span class="social-handle">@TiempoFuera</span>
                    </div>
                `;
            }

            turnoRedSocial = (turnoRedSocial + 1) % 2;
            wrap.classList.add('active');

            setTimeout(() => {
                wrap.classList.remove('active');
            }, 12000);
        }

        setTimeout(mostrarBannerSocial, 15000);
        setInterval(mostrarBannerSocial, 300000);

        renderizarEstructura(configActual);

        const client = mqtt.connect(BROKER_URL, { reconnectPeriod: 1000 });
        client.on('connect', () => {
            client.subscribe(`${CANAL_BASE}/vivo`);
            client.subscribe(`${CANAL_BASE}/config`);
        });
        client.on('message', (topic, message) => {
            if (topic === `${CANAL_BASE}/vivo`) {
                try {
                    datosVivos = JSON.parse(message.toString());
                    aplicarDatosEnPreview();
                } catch (e) {}
            } else if (topic === `${CANAL_BASE}/config`) {
                try {
                    const nuevaCfg = JSON.parse(message.toString());
                    configActual = { ...configActual, ...nuevaCfg };
                    renderizarEstructura(configActual);
                } catch (e) {}
            }
        });
    </script>
</body>
</html>
