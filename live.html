<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Marcador En Vivo — Tiempo Fuera</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Bebas+Neue&family=Chakra+Petch:wght@600;700&family=Oswald:wght@600;700&family=Rajdhani:wght@600;700&family=Russo+One&family=Teko:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background: transparent !important;
            overflow: hidden;
        }
        .obs-anchor {
            position: absolute;
            bottom: var(--sb-bottom, 36px);
            left: 50%;
            transform: translateX(-50%) translateY(0) scale(var(--sb-scale, 1));
            transform-origin: bottom center;
            opacity: 1;
            transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1), transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), bottom 0.25s ease;
            will-change: opacity, transform, bottom;
            z-index: 10;
        }
        .obs-anchor.sb-hidden {
            opacity: 0;
            transform: translateX(-50%) translateY(42px) scale(calc(var(--sb-scale, 1) * 0.97));
            pointer-events: none;
        }

        /* REDES SOCIALES */
        .social-pill-wrap {
            position: absolute;
            top: 44px;
            left: 48px;
            transform: translateX(-36px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1), transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 30;
        }
        .social-pill-wrap.pos-top-right {
            left: auto;
            right: 48px;
            transform: translateX(36px);
        }
        .social-pill-wrap.active {
            opacity: 1;
            transform: translateX(0);
        }
        .social-pill {
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(145deg, #1b1d24 0%, #101217 100%);
            border: 1.5px solid var(--sb-accent, #e3b857);
            border-radius: 10px;
            padding: 9px 18px 9px 13px;
            white-space: nowrap;
            font-family: 'Barlow Condensed', sans-serif;
        }
        .social-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .social-icon.ig {
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
        }
        .social-icon.yt {
            background: linear-gradient(135deg, #ff1e1e 0%, #b80000 100%);
        }
        .social-texts {
            display: flex;
            flex-direction: column;
            line-height: 1.05;
        }
        .social-cta {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--sb-accent, #e3b857);
        }
        .social-handle {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.4px;
        }

        /* TERCIO INFERIOR (LOWER THIRD) */
        .lt-anchor {
            position: absolute;
            bottom: 54px;
            left: 64px;
            transform: translateX(-48px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1), transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 25;
        }
        .lt-anchor.active {
            opacity: 1;
            transform: translateX(0);
        }
        .lt-box {
            display: inline-flex;
            align-items: center;
            gap: 16px;
            padding: 12px 26px 12px 18px;
            border-radius: 12px;
            border-left: 6px solid var(--lt-accent, #e3b857);
            border-top: 1.5px solid var(--lt-accent, #e3b857);
            border-right: 1.5px solid var(--lt-accent, #e3b857);
            border-bottom: 2px solid var(--lt-accent, #e3b857);
            background: var(--lt-bg, #14171f);
            max-width: 1180px;
        }
        .lt-logo {
            height: 68px;
            width: auto;
            max-width: 110px;
            object-fit: contain;
            flex-shrink: 0;
        }
        .lt-divider {
            width: 2px;
            height: 52px;
            background: var(--lt-accent, #e3b857);
            opacity: 0.55;
            flex-shrink: 0;
        }
        .lt-texts {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 3px;
            min-width: 220px;
        }
        .lt-title {
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            line-height: 1.05;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .lt-subtitle {
            font-weight: 700;
            letter-spacing: 0.5px;
            line-height: 1.15;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .lt-fade-swap {
            opacity: 0;
            transform: translateY(4px);
        }

        /* ANIMACIÓN +2 / +3 */
        @keyframes basketBurst {
            0% { opacity: 0; transform: translate(-50%, 6px) scale(0.55); }
            25% { opacity: 1; transform: translate(-50%, -18px) scale(1.28); }
            75% { opacity: 1; transform: translate(-50%, -24px) scale(1.12); }
            100% { opacity: 0; transform: translate(-50%, -32px) scale(0.95); }
        }
        .pts-pop-badge {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: 900;
            font-size: 26px;
            line-height: 1;
            padding: 3px 10px;
            border-radius: 7px;
            pointer-events: none;
            z-index: 30;
            letter-spacing: 0.5px;
            animation: basketBurst 1.15s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .pts-pop-badge.triple {
            background: linear-gradient(135deg, #fff3b0 0%, #f59e0b 55%, #d97706 100%);
            color: #111111;
            border: 1.5px solid #ffffff;
        }
        .pts-pop-badge.doble {
            background: linear-gradient(135deg, #ffffff 0%, #e5e7eb 100%);
            color: #111111;
            border: 1.5px solid var(--sb-accent, #e3b857);
        }
    </style>
</head>
<body>
    <div class="social-pill-wrap" id="socialWrap">
        <div class="social-pill" id="socialCard"></div>
    </div>

    <div class="lt-anchor" id="ltAnchor">
        <div class="lt-box" id="ltBox"></div>
    </div>

    <div class="obs-anchor sb-hidden" id="obsAnchor">
        <div id="marcadorMount"></div>
    </div>

    <script>
        const CANAL_BASE = 'tiempofuera/marcador/tf_canal_secreto_9981';
        const BROKER_URL = 'wss://broker.emqx.io:8084/mqtt';

        let configActual = {
            visible: true,
            boardScale: 1.0,
            boardBottom: 36,
            fontFamily: "'Barlow Condensed', sans-serif",
            accentColor: "#e3b857",
            foulActiveColor: "#ffe600",
            foulBonusColor: "#ff1744",
            ligaSize: 92,
            teamLogoSize: 44,
            teamFontSize: 25,
            scoreBoxSize: 48,
            clockFontSize: 32,
            topBadgeEnabled: false,
            topBadgeMode: 'image',
            topImgSize: 44,
            topImgOffset: 18,
            topTextValue: '',
            topTextColor: '#ffffff',
            topTextSize: 15,
            topTextOffset: 14,
            showShotClock: true,
            name1: "LOCAL",
            bg1Color: "#1c1e24",
            text1Color: "#ffffff",
            name2: "VISITA",
            bg2Color: "#1c1e24",
            text2Color: "#ffffff",
            scoreBgColor: "#0c0d10",
            scoreTextColor: "#e3b857",
            shotBgColor: "#141519",
            shotTextColor: "#ff2a2a",
            clockBgColor: "#141519",
            clockTextColor: "#ffffff",
            periodTextColor: "#e3b857",
            logoLiga: '',
            logo1: '',
            logo2: '',
            logoTop: '',
            socialAutoEnabled: true,
            socialPosition: 'top-left',
            socialIntervalSec: 150,
            ltVisible: false,
            ltShowLigaLogo: true,
            ltMode: 'simple',
            ltTitle: 'HERNÁN ARAUS',
            ltSubtitle: 'PRODUCTOR GENERAL — TIEMPO FUERA',
            ltCarouselLines: 'TRANSMISIÓN EN VIVO\n@TIEMPOFUERA_CL\nBÁSQUETBOL FORMATIVO Y ADULTO',
            ltCarouselSec: 5,
            ltBgColor: '#12151c',
            ltAccentColor: '#e3b857',
            ltTitleColor: '#ffffff',
            ltTitleSize: 34,
            ltSubtitleColor: '#e3b857',
            ltSubtitleSize: 20
        };

        let configLista = false;
        let datosVivos = {};
        let prevPts1 = null;
        let prevPts2 = null;

        try {
            const cache = localStorage.getItem('tf_live_cached_cfg');
            if (cache) {
                configActual = { ...configActual, ...JSON.parse(cache) };
                configLista = true;
            }
        } catch (e) {}

        function aclararHex(hex, porcentaje) {
            hex = (hex || '#1c1e24').replace('#', '');
            let r = parseInt(hex.substring(0, 2), 16);
            let g = parseInt(hex.substring(2, 4), 16);
            let b = parseInt(hex.substring(4, 6), 16);
            r = Math.min(255, Math.floor(r + (255 - r) * porcentaje));
            g = Math.min(255, Math.floor(g + (255 - g) * porcentaje));
            b = Math.min(255, Math.floor(b + (255 - b) * porcentaje));
            return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
        }

        function oscurecerHex(hex, porcentaje) {
            hex = (hex || '#1c1e24').replace('#', '');
            let r = parseInt(hex.substring(0, 2), 16);
            let g = parseInt(hex.substring(2, 4), 16);
            let b = parseInt(hex.substring(4, 6), 16);
            r = Math.max(0, Math.floor(r * (1 - porcentaje)));
            g = Math.max(0, Math.floor(g * (1 - porcentaje)));
            b = Math.max(0, Math.floor(b * (1 - porcentaje)));
            return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
        }

        function calcularAnchoAla(cfg) {
            const maxChars = Math.max((cfg.name1 || '').length, (cfg.name2 || '').length);
            const fSize = cfg.teamFontSize || 25;
            const lSize = cfg.teamLogoSize || 44;
            const anchoTexto = Math.max(140, maxChars * (fSize * 0.56) + 26);
            return Math.round(anchoTexto + lSize + 28);
        }

        function aplicarVisibilidadYEscala(cfg) {
            const anchor = document.getElementById('obsAnchor');
            const socialWrap = document.getElementById('socialWrap');
            const accent = cfg.accentColor || '#e3b857';

            if (anchor) {
                const escala = parseFloat(cfg.boardScale) || 1.0;
                const bottomPx = cfg.boardBottom !== undefined ? parseFloat(cfg.boardBottom) : 36;
                anchor.style.setProperty('--sb-scale', escala);
                anchor.style.setProperty('--sb-bottom', bottomPx + 'px');
                anchor.style.setProperty('--sb-accent', accent);
                if (!configLista || cfg.visible === false) {
                    anchor.classList.add('sb-hidden');
                } else {
                    anchor.classList.remove('sb-hidden');
                }
            }
            if (socialWrap) {
                socialWrap.style.setProperty('--sb-accent', accent);
                socialWrap.classList.toggle('pos-top-right', cfg.socialPosition === 'top-right');
            }
        }

        function renderizarEstructura(cfg) {
            aplicarVisibilidadYEscala(cfg);

            const bg1Light = aclararHex(cfg.bg1Color, 0.22);
            const bg1Dark = oscurecerHex(cfg.bg1Color, 0.14);
            const bg2Light = aclararHex(cfg.bg2Color, 0.22);
            const bg2Dark = oscurecerHex(cfg.bg2Color, 0.14);

            const wingWidth = calcularAnchoAla(cfg);
            const ligaBoxHeight = Math.max(92, cfg.ligaSize || 92);
            const teamLogoSize = cfg.teamLogoSize || 44;
            const teamFontSize = cfg.teamFontSize || 25;

            const ptsFontSize = cfg.scoreBoxSize || 48;
            const scoreBoxHeight = Math.round(ptsFontSize * 1.42);
            const ptsMinWidth = Math.round(ptsFontSize * 1.18);
            const dashSize = Math.round(ptsFontSize * 0.62);
            const clockFontSize = cfg.clockFontSize || 32;
            const periodFontSize = Math.round(clockFontSize * 0.74);

            const ligaHTML = cfg.logoLiga ? `<img src="${cfg.logoLiga}" alt="Liga">` : '';

            let topBadgeHTML = '';
            if (cfg.topBadgeEnabled) {
                if (cfg.topBadgeMode === 'image' && cfg.logoTop) {
                    topBadgeHTML = `<div class="lm-top-overlay-img" style="top: -${cfg.topImgOffset}px;"><img src="${cfg.logoTop}" style="height:${cfg.topImgSize}px;" alt=""></div>`;
                } else if (cfg.topBadgeMode === 'text' && (cfg.topTextValue || '').trim() !== '') {
                    topBadgeHTML = `<div class="lm-top-overlay-text" style="top: -${cfg.topTextOffset}px; font-size: ${cfg.topTextSize}px; color: ${cfg.topTextColor};">${cfg.topTextValue}</div>`;
                }
            }

            const shotClockHTML = cfg.showShotClock ? `<div class="lm-shotclock-badge" id="shotclock"></div>` : '';
            let faltasBase = '';
            for (let i = 1; i <= 5; i++) {
                faltasBase += `<span class="foul-bar" data-idx="${i}"></span>`;
            }

            const img1HTML = cfg.logo1 ? `<img class="lm-team-logo" src="${cfg.logo1}" alt="">` : '';
            const img2HTML = cfg.logo2 ? `<img class="lm-team-logo" src="${cfg.logo2}" alt="">` : '';

            document.getElementById('marcadorMount').innerHTML = `
                <style>
                    .lm-bar { display: inline-flex; align-items: center; height: ${ligaBoxHeight}px; font-family: ${cfg.fontFamily}; user-select: none; }
                    .lm-league-box { height: ${ligaBoxHeight}px; min-width: 86px; padding: 0 10px; display: flex; align-items: center; justify-content: center; margin-right: 10px; }
                    .lm-league-box img { height: ${cfg.ligaSize}px; width: auto; max-width: ${Math.round(cfg.ligaSize * 1.35)}px; object-fit: contain; }
                    .lm-track { display: inline-flex; align-items: center; position: relative; }
                    .lm-team-wing { position: relative; display: flex; align-items: center; height: 60px; width: ${wingWidth}px; padding: 0 14px 0 10px; gap: 10px; border-top: 1.5px solid ${cfg.accentColor}; border-bottom: 2px solid ${cfg.accentColor}; border-left: 1.5px solid ${cfg.accentColor}; border-radius: 10px 0 0 10px; box-sizing: border-box; overflow: hidden; }
                    .lm-team-wing::before { content: ''; position: absolute; inset: 0; background-image: repeating-linear-gradient(-45deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 2px, transparent 2px, transparent 6px); pointer-events: none; }
                    .lm-team-wing.away { flex-direction: row-reverse; padding: 0 10px 0 14px; border-left: none; border-radius: 0; }
                    .lm-team-logo { position: relative; z-index: 2; height: ${teamLogoSize}px; width: ${teamLogoSize}px; object-fit: contain; flex-shrink: 0; }
                    .lm-team-meta { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; min-width: 0; }
                    .lm-team-name { width: 100%; text-align: center; font-size: ${teamFontSize}px; font-weight: 800; letter-spacing: 0.7px; text-transform: uppercase; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
                    .lm-fouls { display: flex; align-items: center; justify-content: center; gap: 5px; margin-top: 6px; width: 100%; }
                    .lm-team-wing.away .lm-fouls { flex-direction: row-reverse; justify-content: center; }
                    .foul-bar { width: 19px; height: 5px; border-radius: 2px; display: inline-block; flex-shrink: 0; transition: all 0.2s ease; }
                    .lm-scores-elevated { position: relative; display: flex; align-items: center; justify-content: center; height: ${scoreBoxHeight}px; background: linear-gradient(180deg, ${aclararHex(cfg.scoreBgColor, 0.14)} 0%, ${cfg.scoreBgColor} 55%, ${oscurecerHex(cfg.scoreBgColor, 0.18)} 100%); padding: 0 14px; gap: 6px; border: 2px solid ${cfg.accentColor}; border-radius: 9px; z-index: 3; }
                    .lm-top-overlay-img { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 5; }
                    .lm-top-overlay-img img { width: auto; max-width: 210px; object-fit: contain; }
                    .lm-top-overlay-text { position: absolute; left: 50%; transform: translateX(-50%); background: linear-gradient(180deg, ${aclararHex(cfg.scoreBgColor, 0.15)}, ${cfg.scoreBgColor}); border: 1.5px solid ${cfg.accentColor}; border-radius: 6px; padding: 2px 12px; font-weight: 800; letter-spacing: 0.9px; text-transform: uppercase; line-height: 1.1; white-space: nowrap; z-index: 5; }
                    .lm-pts-slot { position: relative; display: inline-flex; align-items: center; justify-content: center; min-width: ${ptsMinWidth}px; }
                    .lm-pts { font-size: ${ptsFontSize}px; font-weight: 800; color: ${cfg.scoreTextColor}; text-align: center; font-variant-numeric: tabular-nums; line-height: 0.92; letter-spacing: -0.5px; }
                    .lm-score-dash { font-size: ${dashSize}px; font-weight: 800; color: ${cfg.accentColor}; line-height: 1; opacity: 0.85; padding: 0 1px; }
                    .lm-shotclock-badge { position: absolute; bottom: -17px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, ${aclararHex(cfg.shotBgColor, 0.15)}, ${cfg.shotBgColor}); color: ${cfg.shotTextColor}; border: 1.5px solid ${cfg.accentColor}; border-radius: 6px; font-size: 19px; font-weight: 800; min-width: 40px; height: 24px; padding: 0 7px; font-variant-numeric: tabular-nums; line-height: 1; z-index: 4; }
                    .lm-shotclock-badge:empty { display: none; }
                    .lm-clock-box { display: flex; align-items: center; height: 60px; background: linear-gradient(180deg, ${aclararHex(cfg.clockBgColor, 0.15)} 0%, ${cfg.clockBgColor} 55%, ${oscurecerHex(cfg.clockBgColor, 0.16)} 100%); padding: 0 14px; gap: 10px; border: 1.5px solid ${cfg.accentColor}; border-radius: 0 10px 10px 0; }
                    .lm-timer { font-size: ${clockFontSize}px; font-weight: 700; color: ${cfg.clockTextColor}; font-variant-numeric: tabular-nums; letter-spacing: 0.5px; min-width: ${Math.round(clockFontSize * 2.25)}px; text-align: center; line-height: 1; }
                    .lm-period { font-size: ${periodFontSize}px; font-weight: 800; color: ${cfg.periodTextColor}; background: rgba(255,255,255,0.08); padding: 5px 9px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.18); line-height: 1; }
                </style>
                <div class="lm-bar">
                    <div class="lm-league-box">${ligaHTML}</div>
                    <div class="lm-track">
                        <div class="lm-team-wing" style="background: linear-gradient(90deg, ${bg1Dark} 0%, ${cfg.bg1Color} 45%, ${bg1Light} 100%);">
                            ${img1HTML}
                            <div class="lm-team-meta">
                                <div class="lm-team-name" style="color: ${cfg.text1Color};">${cfg.name1}</div>
                                <div class="lm-fouls" id="fouls1">${faltasBase}</div>
                            </div>
                        </div>
                        <div class="lm-scores-elevated">
                            ${topBadgeHTML}
                            <div class="lm-pts-slot" id="slotPoints1"><div class="lm-pts" id="points1">0</div></div>
                            <div class="lm-score-dash">-</div>
                            <div class="lm-pts-slot" id="slotPoints2"><div class="lm-pts" id="points2">0</div></div>
                            ${shotClockHTML}
                        </div>
                        <div class="lm-team-wing away" style="background: linear-gradient(270deg, ${bg2Dark} 0%, ${cfg.bg2Color} 45%, ${bg2Light} 100%);">
                            ${img2HTML}
                            <div class="lm-team-meta">
                                <div class="lm-team-name" style="color: ${cfg.text2Color};">${cfg.name2}</div>
                                <div class="lm-fouls" id="fouls2">${faltasBase}</div>
                            </div>
                        </div>
                        <div class="lm-clock-box">
                            <div class="lm-timer" id="timer">10:00</div>
                            <div class="lm-period" id="period">Q1</div>
                        </div>
                    </div>
                </div>
            `;
            aplicarDatosVivos(true);
            renderizarTercioInferior(cfg);
        }

        /* TERCIO INFERIOR Y CARRUSEL */
        let ltCarouselTimer = null;
        let ltCarouselIdx = 0;

        function renderizarTercioInferior(cfg) {
            const anchor = document.getElementById('ltAnchor');
            const box = document.getElementById('ltBox');
            if (!anchor || !box) return;

            if (ltCarouselTimer) {
                clearInterval(ltCarouselTimer);
                ltCarouselTimer = null;
            }

            if (!cfg.ltVisible) {
                anchor.classList.remove('active');
                return;
            }

            const tieneLogo = cfg.ltShowLigaLogo !== false && cfg.logoLiga;
            const logoPart = tieneLogo
                ? `<img class="lt-logo" src="${cfg.logoLiga}" alt="Liga"><div class="lt-divider"></div>`
                : '';

            const lineas = (cfg.ltCarouselLines || '')
                .split('\n')
                .map(s => s.trim())
                .filter(Boolean);

            const textoInicialSub = (cfg.ltMode === 'carousel' && lineas.length > 0)
                ? lineas[0]
                : (cfg.ltSubtitle || '');

            const subVisible = textoInicialSub.trim() !== '';

            box.style.setProperty('--lt-bg', cfg.ltBgColor || '#12151c');
            box.style.setProperty('--lt-accent', cfg.ltAccentColor || '#e3b857');
            box.style.fontFamily = cfg.fontFamily || "'Barlow Condensed', sans-serif";

            box.innerHTML = `
                ${logoPart}
                <div class="lt-texts">
                    <div class="lt-title" id="ltTitleEl" style="color:${cfg.ltTitleColor || '#ffffff'}; font-size:${cfg.ltTitleSize || 34}px;">
                        ${cfg.ltTitle || ''}
                    </div>
                    ${subVisible ? `<div class="lt-subtitle" id="ltSubEl" style="color:${cfg.ltSubtitleColor || '#e3b857'}; font-size:${cfg.ltSubtitleSize || 20}px;">${textoInicialSub}</div>` : ''}
                </div>
            `;

            anchor.classList.add('active');

            if (cfg.ltMode === 'carousel' && lineas.length > 1) {
                ltCarouselIdx = 0;
                const segs = Math.max(2, parseInt(cfg.ltCarouselSec, 10) || 5) * 1000;
                ltCarouselTimer = setInterval(() => {
                    const subEl = document.getElementById('ltSubEl');
                    if (!subEl) return;
                    ltCarouselIdx = (ltCarouselIdx + 1) % lineas.length;
                    subEl.classList.add('lt-fade-swap');
                    setTimeout(() => {
                        subEl.textContent = lineas[ltCarouselIdx];
                        subEl.classList.remove('lt-fade-swap');
                    }, 280);
                }, segs);
            }
        }

        function dispararAnimacionCanasta(slotId, puntosElementId, nuevoValor, delta) {
            const slot = document.getElementById(slotId);
            const ptsEl = document.getElementById(puntosElementId);
            if (!slot || !ptsEl) return;

            const oldBadge = slot.querySelector('.pts-pop-badge');
            if (oldBadge) oldBadge.remove();

            const badge = document.createElement('div');
            badge.className = 'pts-pop-badge ' + (delta === 3 ? 'triple' : 'doble');
            badge.textContent = '+' + delta;
            slot.appendChild(badge);

            setTimeout(() => {
                ptsEl.textContent = nuevoValor;
            }, 340);

            setTimeout(() => {
                if (badge && badge.parentNode) badge.remove();
            }, 1200);
        }

        function actualizarFaltas(id, cantidad) {
            const cont = document.getElementById(id);
            if (!cont) return;
            const barras = cont.querySelectorAll('.foul-bar');
            const num = parseInt(cantidad, 10) || 0;
            barras.forEach((b, idx) => {
                const n = idx + 1;
                const esBonus = n === 5;
                if (n <= num) {
                    const col = esBonus ? configActual.foulBonusColor : configActual.foulActiveColor;
                    b.style.background = col;
                    b.style.border = "1px solid #111111";
                } else {
                    b.style.background = "rgba(0,0,0,0.42)";
                    b.style.border = "1px solid rgba(255,255,255,0.38)";
                }
            });
        }

        function formatearPeriodo(momentRaw, overtimeLed) {
            if (overtimeLed !== undefined && overtimeLed !== "" && overtimeLed !== "0") return "OT";
            const n = parseInt(String(momentRaw).replace(/[^0-9]/g, ""), 10);
            if (isNaN(n) || n <= 0) return "Q1";
            if (n <= 4) return "Q" + n;
            return "OT" + (n - 4);
        }

        function aplicarDatosVivos(esRenderInicial = false) {
            const l = datosVivos;
            if (!l) return;
            const p1Str = (l.points_1 || l.points1 || l.score_1 || l.score1 || "").replace(/[^0-9]/g, "");
            const p2Str = (l.points_2 || l.points2 || l.score_2 || l.score2 || "").replace(/[^0-9]/g, "");

            if (p1Str !== "") {
                const num1 = parseInt(p1Str, 10);
                const el1 = document.getElementById("points1");
                if (el1) {
                    if (!esRenderInicial && prevPts1 !== null && (num1 - prevPts1 === 2 || num1 - prevPts1 === 3)) {
                        dispararAnimacionCanasta("slotPoints1", "points1", p1Str, num1 - prevPts1);
                    } else {
                        el1.textContent = p1Str;
                    }
                }
                prevPts1 = num1;
            }

            if (p2Str !== "") {
                const num2 = parseInt(p2Str, 10);
                const el2 = document.getElementById("points2");
                if (el2) {
                    if (!esRenderInicial && prevPts2 !== null && (num2 - prevPts2 === 2 || num2 - prevPts2 === 3)) {
                        dispararAnimacionCanasta("slotPoints2", "points2", p2Str, num2 - prevPts2);
                    } else {
                        el2.textContent = p2Str;
                    }
                }
                prevPts2 = num2;
            }

            if (configActual.showShotClock && l.shotclock !== undefined) {
                const sc = document.getElementById("shotclock");
                if (sc) sc.textContent = l.shotclock.replace(/[^0-9]/g, "");
            }
            if (l.fouls_1 !== undefined) actualizarFaltas("fouls1", l.fouls_1.replace(/[^0-9]/g, ""));
            if (l.fouls_2 !== undefined) actualizarFaltas("fouls2", l.fouls_2.replace(/[^0-9]/g, ""));
            if (l.moment !== undefined && l.moment !== "") {
                const per = document.getElementById("period");
                if (per) per.textContent = formatearPeriodo(l.moment, l.overtime_led);
            }
            if (l.timer !== undefined && l.timer !== "") {
                const tim = document.getElementById("timer");
                if (tim) tim.textContent = l.timer;
            }
        }

        /* REDES SOCIALES */
        let turnoRedSocial = 0;
        let socialHideTimeout = null;
        let socialAutoInterval = null;

        function mostrarBannerSocial(forzar = false) {
            if (!forzar && configActual.socialAutoEnabled === false) return;
            const wrap = document.getElementById('socialWrap');
            const card = document.getElementById('socialCard');
            if (!wrap || !card) return;

            if (socialHideTimeout) clearTimeout(socialHideTimeout);

            if (turnoRedSocial === 0) {
                card.innerHTML = `
                    <div class="social-icon ig">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                        </svg>
                    </div>
                    <div class="social-texts">
                        <span class="social-cta">Síguenos en Instagram</span>
                        <span class="social-handle">@tiempofuera_cl</span>
                    </div>
                `;
            } else {
                card.innerHTML = `
                    <div class="social-icon yt">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffffff">
                            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                        </svg>
                    </div>
                    <div class="social-texts">
                        <span class="social-cta">¡Suscríbete en YouTube!</span>
                        <span class="social-handle">@tiempofuera_cl</span>
                    </div>
                `;
            }

            turnoRedSocial = (turnoRedSocial + 1) % 2;
            wrap.classList.add('active');

            socialHideTimeout = setTimeout(() => {
                wrap.classList.remove('active');
            }, 11000);
        }

        function reiniciarCicloSocial() {
            if (socialAutoInterval) clearInterval(socialAutoInterval);
            const ms = Math.max(20, parseInt(configActual.socialIntervalSec, 10) || 150) * 1000;
            socialAutoInterval = setInterval(() => mostrarBannerSocial(false), ms);
        }

        setTimeout(() => mostrarBannerSocial(false), 3000);
        reiniciarCicloSocial();

        renderizarEstructura(configActual);

        let ultimoPaqueteTs = Date.now();
        let client = null;

        function iniciarConexionExclusivaLive() {
            if (client) {
                try { client.end(true); } catch (e) {}
            }
            const uniqueId = 'tf_live_obs_' + Math.random().toString(16).slice(2, 10);
            client = mqtt.connect(BROKER_URL, {
                clientId: uniqueId,
                keepalive: 10,
                reconnectPeriod: 800,
                connectTimeout: 4000,
                clean: true
            });

            client.on('connect', () => {
                ultimoPaqueteTs = Date.now();
                client.subscribe(`${CANAL_BASE}/vivo`, { qos: 0 });
                client.subscribe(`${CANAL_BASE}/config`, { qos: 1 });
                client.subscribe(`${CANAL_BASE}/cmd`, { qos: 1 });
            });

            client.on('message', (topic, message) => {
                ultimoPaqueteTs = Date.now();
                if (topic === `${CANAL_BASE}/vivo`) {
                    try {
                        datosVivos = JSON.parse(message.toString());
                        aplicarDatosVivos(false);
                    } catch (e) {}
                } else if (topic === `${CANAL_BASE}/config`) {
                    try {
                        const nuevaCfg = JSON.parse(message.toString());
                        configActual = { ...configActual, ...nuevaCfg };
                        configLista = true;
                        try {
                            localStorage.setItem('tf_live_cached_cfg', JSON.stringify(configActual));
                        } catch (e) {}
                        renderizarEstructura(configActual);
                        reiniciarCicloSocial();
                    } catch (e) {}
                } else if (topic === `${CANAL_BASE}/cmd`) {
                    try {
                        const cmd = JSON.parse(message.toString());
                        if (cmd.action === 'social_now') {
                            if (cmd.network === 'ig') turnoRedSocial = 0;
                            if (cmd.network === 'yt') turnoRedSocial = 1;
                            mostrarBannerSocial(true);
                        }
                    } catch (e) {}
                }
            });
        }

        iniciarConexionExclusivaLive();

        setInterval(() => {
            if (client && client.connected) {
                client.publish(`${CANAL_BASE}/ping_live`, String(Date.now()), { qos: 0 });
            } else {
                iniciarConexionExclusivaLive();
            }
            if (Date.now() - ultimoPaqueteTs > 15000) {
                iniciarConexionExclusivaLive();
            }
        }, 8000);
    </script>
</body>
</html>
