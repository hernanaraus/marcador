<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Marcador En Vivo — Tiempo Fuera</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Bebas+Neue&family=Chakra+Petch:wght@600;700&family=Oswald:wght@600;700&family=Rajdhani:wght@600;700&family=Russo+One&family=Teko:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background: transparent !important;
            overflow: hidden;
        }
        .obs-anchor {
            position: absolute;
            bottom: var(--sb-bottom, 36px);
            left: 50%;
            transform: translateX(-50%) translateY(0) scale(var(--sb-scale, 1));
            transform-origin: bottom center;
            opacity: 1;
            transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1), transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), bottom 0.25s ease;
            will-change: opacity, transform, bottom;
            z-index: 10;
        }
        .obs-anchor.sb-hidden {
            opacity: 0;
            transform: translateX(-50%) translateY(42px) scale(calc(var(--sb-scale, 1) * 0.97));
            pointer-events: none;
        }

        /* REDES SOCIALES CON ESCALA AMPLIADA */
        .social-pill-wrap {
            position: absolute;
            top: 44px;
            left: 48px;
            transform: translateX(-36px) scale(var(--social-scale, 1.25));
            transform-origin: top left;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1), transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 30;
        }
        .social-pill-wrap.pos-top-right {
            left: auto;
            right: 48px;
            transform-origin: top right;
            transform: translateX(36px) scale(var(--social-scale, 1.25));
        }
        .social-pill-wrap.active {
            opacity: 1;
            transform: translateX(0) scale(var(--social-scale, 1.25));
        }
        .social-pill {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #14171f;
            border: 2px solid var(--sb-accent, #e3b857);
            border-radius: 10px;
            padding: 9px 18px 9px 13px;
            white-space: nowrap;
            font-family: 'Barlow Condensed', sans-serif;
        }
        .social-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .social-icon.ig {
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
        }
        .social-icon.yt {
            background: linear-gradient(135deg, #ff1e1e 0%, #b80000 100%);
        }
        .social-texts {
            display: flex;
            flex-direction: column;
            line-height: 1.05;
        }
        .social-cta {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--sb-accent, #e3b857);
        }
        .social-handle {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.4px;
        }

        /* ANIMACIÓN +2 / +3 */
        @keyframes basketBurst {
            0% { opacity: 0; transform: translate(-50%, 6px) scale(0.55); }
            25% { opacity: 1; transform: translate(-50%, -18px) scale(1.28); }
            75% { opacity: 1; transform: translate(-50%, -24px) scale(1.12); }
            100% { opacity: 0; transform: translate(-50%, -32px) scale(0.95); }
        }
        .pts-pop-badge {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: 900;
            font-size: 26px;
            line-height: 1;
            padding: 3px 10px;
            border-radius: 7px;
            pointer-events: none;
            z-index: 30;
            letter-spacing: 0.5px;
            animation: basketBurst 1.15s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .pts-pop-badge.triple {
            background: #f59e0b;
            color: #111111;
            border: 1.5px solid #ffffff;
        }
        .pts-pop-badge.doble {
            background: #ffffff;
            color: #111111;
            border: 1.5px solid var(--sb-accent, #e3b857);
        }
    </style>
</head>
<body>
    <div class="social-pill-wrap" id="socialWrap">
        <div class="social-pill" id="socialCard"></div>
    </div>

    <div class="obs-anchor sb-hidden" id="obsAnchor">
        <div id="marcadorMount"></div>
    </div>

    <script>
        const CANAL_BASE = 'tiempofuera/marcador/tf_canal_secreto_9981';
        const BROKER_URL = 'wss://broker.emqx.io:8084/mqtt';

        let configActual = {
            visible: true,
            boardScale: 1.0,
            boardBottom: 36,
            fontFamily: "'Barlow Condensed', sans-serif",
            accentColor: "#e3b857",
            foulActiveColor: "#ffe600",
            foulBonusColor: "#ff1744",
            ligaSize: 92,
            teamLogoSize: 44,
            teamFontSize: 25,
            scoreBoxSize: 48,
            clockFontSize: 32,
            topBadgeEnabled: false,
            topBadgeMode: 'image',
            topImgSize: 54,
            topImgOffset: 24,
            topTextValue: '',
            topTextColor: '#ffffff',
            topTextSize: 18,
            topTextOffset: 18,
            showShotClock: true,
            name1: "LOCAL",
            bg1Color: "#1c1e24",
            text1Color: "#ffffff",
            name2: "VISITA",
            bg2Color: "#1c1e24",
            text2Color: "#ffffff",
            scoreBgColor: "#0c0d10",
            scoreTextColor: "#e3b857",
            shotBgColor: "#141519",
            shotTextColor: "#ff2a2a",
            clockBgColor: "#141519",
            clockTextColor: "#ffffff",
            periodTextColor: "#e3b857",
            logoLiga: '',
            logo1: '',
            logo2: '',
            logoTop: '',
            socialAutoEnabled: true,
            socialPosition: 'top-left',
            socialScale: 1.35,
            socialIntervalSec: 150
        };

        let configLista = false;
        let datosVivos = {};
        let prevPts1 = null;
        let prevPts2 = null;

        try {
            const cache = localStorage.getItem('tf_live_cached_cfg');
            if (cache) {
                configActual = { ...configActual, ...JSON.parse(cache) };
                configLista = true;
            }
        } catch (e) {}

        function obtenerLuminosidad(hex) {
            hex = (hex || '#1c1e24').replace('#', '');
            if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
            const r = parseInt(hex.substring(0, 2), 16) || 0;
            const g = parseInt(hex.substring(2, 4), 16) || 0;
            const b = parseInt(hex.substring(4, 6), 16) || 0;
            return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        }

        function aclararHex(hex, porcentaje) {
            hex = (hex || '#1c1e24').replace('#', '');
            let r = parseInt(hex.substring(0, 2), 16);
            let g = parseInt(hex.substring(2, 4), 16);
            let b = parseInt(hex.substring(4, 6), 16);
            r = Math.min(255, Math.floor(r + (255 - r) * porcentaje));
            g = Math.min(255, Math.floor(g + (255 - g) * porcentaje));
            b = Math.min(255, Math.floor(b + (255 - b) * porcentaje));
            return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
        }

        function oscurecerHex(hex, porcentaje) {
            hex = (hex || '#1c1e24').replace('#', '');
            let r = parseInt(hex.substring(0, 2), 16);
            let g = parseInt(hex.substring(2, 4), 16);
            let b = parseInt(hex.substring(4, 6), 16);
            r = Math.max(0, Math.floor(r * (1 - porcentaje)));
            g = Math.max(0, Math.floor(g * (1 - porcentaje)));
            b = Math.max(0, Math.floor(b * (1 - porcentaje)));
            return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
        }

        function calcularEstiloTextoEquipo(bgColor, textColor) {
            const lumBg = obtenerLuminosidad(bgColor);
            const lumTxt = obtenerLuminosidad(textColor);
            if (lumTxt > 0.55) {
                return lumBg > 0.45
                    ? '0 1px 2px rgba(0,0,0,0.95), 0 0 4px rgba(0,0,0,0.85)'
                    : '0 1px 2px rgba(0,0,0,0.75)';
            } else {
                return lumBg < 0.55
                    ? '0 1px 2px rgba(255,255,255,0.85), 0 0 3px rgba(255,255,255,0.65)'
                    : '0 1px 1px rgba(255,255,255,0.5)';
            }
        }

        function calcularAnchoAla(cfg) {
            const maxChars = Math.max((cfg.name1 || '').length, (cfg.name2 || '').length);
            const fSize = cfg.teamFontSize || 25;
            const lSize = cfg.teamLogoSize || 44;
            const anchoTexto = Math.max(140, maxChars * (fSize * 0.56) + 26);
            return Math.round(anchoTexto + lSize + 28);
        }

        function aplicarVisibilidadYEscala(cfg) {
            const anchor = document.getElementById('obsAnchor');
            const socialWrap = document.getElementById('socialWrap');
            const accent = cfg.accentColor || '#e3b857';

            if (anchor) {
                const escala = parseFloat(cfg.boardScale) || 1.0;
                const bottomPx = cfg.boardBottom !== undefined ? parseFloat(cfg.boardBottom) : 36;
                anchor.style.setProperty('--sb-scale', escala);
                anchor.style.setProperty('--sb-bottom', bottomPx + 'px');
                anchor.style.setProperty('--sb-accent', accent);
                if (!configLista || cfg.visible === false) {
                    anchor.classList.add('sb-hidden');
                } else {
                    anchor.classList.remove('sb-hidden');
                }
            }
            if (socialWrap) {
                const sScale = parseFloat(cfg.socialScale) || 1.35;
                socialWrap.style.setProperty('--sb-accent', accent);
                socialWrap.style.setProperty('--social-scale', sScale);
                socialWrap.classList.toggle('pos-top-right', cfg.socialPosition === 'top-right');
            }
        }

        function renderizarEstructura(cfg) {
            aplicarVisibilidadYEscala(cfg);

            const lum1 = obtenerLuminosidad(cfg.bg1Color);
            const lum2 = obtenerLuminosidad(cfg.bg2Color);

            const bg1Light = lum1 > 0.65 ? aclararHex(cfg.bg1Color, 0.08) : aclararHex(cfg.bg1Color, 0.22);
            const bg1Dark = lum1 > 0.65 ? oscurecerHex(cfg.bg1Color, 0.16) : oscurecerHex(cfg.bg1Color, 0.14);
            const bg2Light = lum2 > 0.65 ? aclararHex(cfg.bg2Color, 0.08) : aclararHex(cfg.bg2Color, 0.22);
            const bg2Dark = lum2 > 0.65 ? oscurecerHex(cfg.bg2Color, 0.16) : oscurecerHex(cfg.bg2Color, 0.14);

            // Textura adaptativa: oscura suave en fondos claros, clara suave en fondos oscuros
            const stripe1 = lum1 > 0.55 ? 'rgba(0,0,0,0.085)' : 'rgba(255,255,255,0.048)';
            const stripe2 = lum2 > 0.55 ? 'rgba(0,0,0,0.085)' : 'rgba(255,255,255,0.048)';

            const textShadow1 = calcularEstiloTextoEquipo(cfg.bg1Color, cfg.text1Color);
            const textShadow2 = calcularEstiloTextoEquipo(cfg.bg2Color, cfg.text2Color);

            const wingWidth = calcularAnchoAla(cfg);
            const ligaBoxHeight = Math.max(92, cfg.ligaSize || 92);
            const teamLogoSize = cfg.teamLogoSize || 44;
            const teamFontSize = cfg.teamFontSize || 25;

            const ptsFontSize = cfg.scoreBoxSize || 48;
            const scoreBoxHeight = Math.round(ptsFontSize * 1.42);
            const ptsMinWidth = Math.round(ptsFontSize * 1.18);
            const dashSize = Math.round(ptsFontSize * 0.62);
            const clockFontSize = cfg.clockFontSize || 32;
            const periodFontSize = Math.round(clockFontSize * 0.74);

            const ligaHTML = cfg.logoLiga ? `<img src="${cfg.logoLiga}" alt="Liga">` : '';

            let topBadgeHTML = '';
            if (cfg.topBadgeEnabled) {
                if (cfg.topBadgeMode === 'image' && cfg.logoTop) {
                    topBadgeHTML = `<div class="lm-top-overlay-img" style="top: -${cfg.topImgOffset}px;"><img src="${cfg.logoTop}" style="height:${cfg.topImgSize}px;" alt=""></div>`;
                } else if (cfg.topBadgeMode === 'text' && (cfg.topTextValue || '').trim() !== '') {
                    const tOffset = cfg.topTextOffset || Math.round((cfg.topTextSize || 18) * 0.95);
                    topBadgeHTML = `<div class="lm-top-overlay-text" style="top: -${tOffset}px; font-size: ${cfg.topTextSize}px; color: ${cfg.topTextColor};">${cfg.topTextValue}</div>`;
                }
            }

            const shotClockHTML = cfg.showShotClock ? `<div class="lm-shotclock-badge" id="shotclock"></div>` : '';
            let faltasBase = '';
            for (let i = 1; i <= 5; i++) {
                faltasBase += `<span class="foul-bar" data-idx="${i}"></span>`;
            }

            const img1HTML = cfg.logo1 ? `<img class="lm-team-logo" src="${cfg.logo1}" alt="">` : '';
            const img2HTML = cfg.logo2 ? `<img class="lm-team-logo" src="${cfg.logo2}" alt="">` : '';

            document.getElementById('marcadorMount').innerHTML = `
                <style>
                    .lm-bar { display: inline-flex; align-items: center; height: ${ligaBoxHeight}px; font-family: ${cfg.fontFamily}; user-select: none; background: transparent; }
                    .lm-league-box { height: ${ligaBoxHeight}px; min-width: 86px; padding: 0 10px; display: flex; align-items: center; justify-content: center; margin-right: 10px; background: transparent; }
                    .lm-league-box img { height: ${cfg.ligaSize}px; width: auto; max-width: ${Math.round(cfg.ligaSize * 1.35)}px; object-fit: contain; }
                    .lm-track { display: inline-flex; align-items: center; position: relative; background: transparent; }
                    .lm-team-wing { position: relative; display: flex; align-items: center; height: 60px; width: ${wingWidth}px; padding: 0 14px 0 10px; gap: 10px; background: linear-gradient(90deg, ${bg1Dark} 0%, ${cfg.bg1Color} 45%, ${bg1Light} 100%); border-top: 1.5px solid ${cfg.accentColor}; border-bottom: 2px solid ${cfg.accentColor}; border-left: 1.5px solid ${cfg.accentColor}; border-radius: 10px 0 0 10px; box-sizing: border-box; box-shadow: inset 0 1px 0 rgba(255,255,255,0.22); overflow: hidden; }
                    .lm-team-wing::before { content: ''; position: absolute; inset: 0; background-image: repeating-linear-gradient(-45deg, ${stripe1} 0px, ${stripe1} 2px, transparent 2px, transparent 6px); pointer-events: none; z-index: 1; }
                    .lm-team-wing::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0.02) 48%, rgba(0,0,0,0.10) 100%); pointer-events: none; z-index: 1; }
                    .lm-team-wing.away { flex-direction: row-reverse; padding: 0 10px 0 14px; background: linear-gradient(270deg, ${bg2Dark} 0%, ${cfg.bg2Color} 45%, ${bg2Light} 100%); border-left: none; border-radius: 0; }
                    .lm-team-wing.away::before { background-image: repeating-linear-gradient(45deg, ${stripe2} 0px, ${stripe2} 2px, transparent 2px, transparent 6px); }
                    .lm-team-logo { position: relative; z-index: 2; height: ${teamLogoSize}px; width: ${teamLogoSize}px; object-fit: contain; flex-shrink: 0; }
                    .lm-team-meta { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; min-width: 0; }
                    .lm-team-name { width: 100%; text-align: center; font-size: ${teamFontSize}px; font-weight: 800; letter-spacing: 0.7px; text-transform: uppercase; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
                    .lm-fouls { display: flex; align-items: center; justify-content: center; gap: 5px; margin-top: 6px; width: 100%; }
                    .lm-team-wing.away .lm-fouls { flex-direction: row-reverse; justify-content: center; }
                    .foul-bar { width: 19px; height: 5px; border-radius: 2px; display: inline-block; flex-shrink: 0; transition: all 0.2s ease; }
                    .lm-scores-elevated { position: relative; display: flex; align-items: center; justify-content: center; height: ${scoreBoxHeight}px; background: linear-gradient(180deg, ${aclararHex(cfg.scoreBgColor, 0.14)} 0%, ${cfg.scoreBgColor} 55%, ${oscurecerHex(cfg.scoreBgColor, 0.18)} 100%); padding: 0 14px; gap: 6px; border: 2px solid ${cfg.accentColor}; border-radius: 9px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.22); z-index: 3; }
                    .lm-top-overlay-img { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 5; }
                    .lm-top-overlay-img img { width: auto; max-width: 320px; object-fit: contain; }
                    .lm-top-overlay-text { position: absolute; left: 50%; transform: translateX(-50%); background: ${cfg.scoreBgColor}; border: 1.5px solid ${cfg.accentColor}; border-radius: 6px; padding: 3px 14px; font-weight: 800; letter-spacing: 0.9px; text-transform: uppercase; line-height: 1.1; white-space: nowrap; z-index: 5; }
                    .lm-pts-slot { position: relative; display: inline-flex; align-items: center; justify-content: center; min-width: ${ptsMinWidth}px; }
                    .lm-pts { font-size: ${ptsFontSize}px; font-weight: 800; color: ${cfg.scoreTextColor}; text-align: center; font-variant-numeric: tabular-nums; line-height: 0.92; letter-spacing: -0.5px; }
                    .lm-score-dash { font-size: ${dashSize}px; font-weight: 800; color: ${cfg.accentColor}; line-height: 1; opacity: 0.85; padding: 0 1px; }
                    .lm-shotclock-badge { position: absolute; bottom: -17px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; justify-content: center; background: ${cfg.shotBgColor}; color: ${cfg.shotTextColor}; border: 1.5px solid ${cfg.accentColor}; border-radius: 6px; font-size: 19px; font-weight: 800; min-width: 40px; height: 24px; padding: 0 7px; font-variant-numeric: tabular-nums; line-height: 1; z-index: 4; }
                    .lm-shotclock-badge:empty { display: none; }
                    .lm-clock-box { display: flex; align-items: center; height: 60px; background: linear-gradient(180deg, ${aclararHex(cfg.clockBgColor, 0.14)} 0%, ${cfg.clockBgColor} 55%, ${oscurecerHex(cfg.clockBgColor, 0.16)} 100%); padding: 0 14px; gap: 10px; border: 1.5px solid ${cfg.accentColor}; border-radius: 0 10px 10px 0; box-shadow: inset 0 1px 0 rgba(255,255,255,0.2); }
                    .lm-timer { font-size: ${clockFontSize}px; font-weight: 700; color: ${cfg.clockTextColor}; font-variant-numeric: tabular-nums; letter-spacing: 0.5px; min-width: ${Math.round(clockFontSize * 2.25)}px; text-align: center; line-height: 1; }
                    .lm-period { font-size: ${periodFontSize}px; font-weight: 800; color: ${cfg.periodTextColor}; background: rgba(255,255,255,0.08); padding: 5px 9px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.22); line-height: 1; }
                </style>
                <
